name: Schedule CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка страницы
        run: python -m unittest discover -s tests -v

      - name: Подготовка артефакта сайта
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: self-hosted

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Публикация сайта
        id: deployment
        uses: actions/deploy-pages@v4
